services:
  pay360bh:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: homolog
      APP_URL: https://${PAY_HOST:?defina o host de homologacao no Portainer}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina o email administrativo no Portainer}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?defina o hash da senha administrativa no Portainer}
      DB_DRIVER: pgsql
      DB_HOST: postgres-postgres-1
      DB_PORT: 5432
      DB_DATABASE: central_cobrancas_sandbox
      DB_SCHEMA: pvfbh8yqws2olzw
      DB_USERNAME: pay360bh_login
      DB_PASSWORD: ${PAY_DB_PASSWORD:?defina a senha do usuario PostgreSQL pay360bh_login}
      CENTRAL_N8N_PAYMENT_WEBHOOK_URL: ${CENTRAL_N8N_PAYMENT_WEBHOOK_URL:?defina a URL de producao do webhook Sandbox do n8n}
      CENTRAL_N8N_TOKEN: ${CENTRAL_N8N_TOKEN:?defina o token interno do webhook Sandbox}
    networks:
      - 360Network
    labels:
      - traefik.enable=true
      - traefik.docker.network=360Network
      - traefik.http.routers.pay360bh.rule=Host(`${PAY_HOST}`)
      - traefik.http.routers.pay360bh.entrypoints=websecure
      - traefik.http.routers.pay360bh.tls=true
      - traefik.http.routers.pay360bh.tls.certresolver=letsencryptresolver
      - traefik.http.services.pay360bh.loadbalancer.server.port=80

networks:
  360Network:
    external: true
